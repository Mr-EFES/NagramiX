name: Проверка официального upstream Telegram-iOS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сравнить pin с официальным репозиторием Telegram-iOS
        run: python3 scripts/check_upstreams.py --json --require-current
