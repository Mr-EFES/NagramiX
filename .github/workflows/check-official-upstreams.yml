name: Check official Telegram-iOS upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pin with official Telegram-iOS repository
        run: python3 scripts/check_upstreams.py --json --require-current
