name: Publish NagramiX release artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful unsigned-IPA workflow run id
        required: true
        type: string
      artifact_name:
        description: Artifact name produced by the build
        required: true
        type: string
      tag:
        description: GitHub release tag shared by the IPA and APK
        required: true
        default: v0.2.6
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NagramiX release metadata
        uses: actions/checkout@v4

      - name: Download the verified workflow artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - name: Validate release files
        shell: bash
        run: |
          test -f release-assets/NagramiX-0.2.6-unsigned.ipa
          test -f release-assets/BUILD-PROVENANCE.txt
          unzip -t release-assets/NagramiX-0.2.6-unsigned.ipa
          sha256sum release-assets/NagramiX-0.2.6-unsigned.ipa

      - name: Create or update the 0.2.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${{ inputs.tag }}" \
              --repo "${{ github.repository }}" \
              --title "NagramiX 0.2.6" \
              --notes-file product/releases/0.2.6.md \
              --latest
          else
            gh release create "${{ inputs.tag }}" \
              --repo "${{ github.repository }}" \
              --title "NagramiX 0.2.6" \
              --notes-file product/releases/0.2.6.md \
              --latest \
              --target "${{ github.sha }}"
          fi
          gh release upload "${{ inputs.tag }}" \
            release-assets/NagramiX-0.2.6-unsigned.ipa \
            release-assets/BUILD-PROVENANCE.txt \
            --repo "${{ github.repository }}" \
            --clobber
