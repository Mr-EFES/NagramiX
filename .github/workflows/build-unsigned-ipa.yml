name: Сборка неподписанного IPA NagramiX

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: ID готовой сборки для публикации без повторной компиляции (пусто — собрать заново)
        type: string
        required: false
        default: ""
      clean_build:
        description: Чистая сборка без кеша Bazel (при публикации включается автоматически)
        type: boolean
        required: true
        default: false
      publish_release:
        description: Подготовить проверенный релиз для публикации от Mr_EFES
        type: boolean
        required: true
        default: false
      prerelease:
        description: Пометить публикацию как тестовую версию
        type: boolean
        required: true
        default: true

env:
  NAGRAMIX_VERSION: 0.9.0

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.artifact_run_id == '' }}
    outputs:
      version: ${{ steps.provenance.outputs.version }}
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      BAZEL_CACHE: ${{ github.workspace }}/.bazel-cache

    steps:
      - name: Проверить аккаунт запуска сборки
        shell: bash
        run: |
          test "$GITHUB_ACTOR" = "Mr-EFES"
          test "$GITHUB_TRIGGERING_ACTOR" = "Mr-EFES"

      - name: Получить overlay NagramiX
        uses: actions/checkout@v4

      - name: Подготовить чистую SDK-сборку
        if: ${{ inputs.clean_build || inputs.publish_release }}
        shell: bash
        run: |
          test "$BAZEL_CACHE" = "$GITHUB_WORKSPACE/.bazel-cache"
          rm -rf -- "$BAZEL_CACHE"
          mkdir -p "$BAZEL_CACHE"

      - name: Проверить метаданные релиза
        run: |
          python3 scripts/validate_release_metadata.py
          python3 scripts/validate_release_build_mode.py
          python3 scripts/validate_owner_publication.py
          python3 scripts/validate_ipa_localization_contract.py
          python3 scripts/validate_upstream_dependencies.py
          python3 scripts/validate_upstream_13_2_input_origins.py
          python3 scripts/validate_custom_member_references.py --canonical

      - name: Проверить актуальность официальной базы Telegram-iOS
        run: python3 scripts/check_upstreams.py --platform ios --require-current

      - name: Загрузить закреплённую ссылку upstream
        id: upstream
        shell: bash
        run: |
          cat ios/upstream.env >> "$GITHUB_ENV"
          source ios/upstream.env
          echo "ref=$TELEGRAM_IOS_REF" >> "$GITHUB_OUTPUT"
          echo "legacy_ref=$TELEGRAM_IOS_LEGACY_REF" >> "$GITHUB_OUTPUT"

      - name: Проверить обязательные учётные данные Telegram API
        shell: bash
        run: |
          test -n "$TELEGRAM_API_ID" || { echo "Missing TELEGRAM_API_ID repository secret"; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "Missing TELEGRAM_API_HASH repository secret"; exit 1; }

      - name: Получить Telegram-iOS
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: ${{ steps.upstream.outputs.ref }}
          path: Telegram-iOS
          submodules: false
          fetch-depth: 1

      - name: Получить закреплённые зависимости Telegram13.2
        run: python3 scripts/fetch_upstream_submodules.py --source Telegram-iOS --provenance "$RUNNER_TEMP/nagramix-dependencies.txt"

      - name: Проверить ожидаемую версию upstream
        shell: bash
        run: |
          actual="$(python3 -c 'import json; print(json.load(open("Telegram-iOS/versions.json"))["app"])')"
          test "$actual" = "$TELEGRAM_IOS_VERSION" || {
            echo "Pinned ref reports Telegram $actual, expected $TELEGRAM_IOS_VERSION"
            exit 1
          }

      - name: Получить закреплённую базу преобразования overlay
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: ${{ steps.upstream.outputs.legacy_ref }}
          path: Telegram-overlay-input
          submodules: false
          fetch-depth: 1

      - name: Выбрать требуемую версию Xcode
        shell: bash
        run: |
          xcode_version="$(python3 -c 'import json; print(json.load(open("Telegram-iOS/versions.json"))["xcode"])')"
          sudo xcode-select -s "/Applications/Xcode_${xcode_version}.app/Contents/Developer"

      - name: Подготовить Metal Toolchain для Xcode
        shell: bash
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal
          xcrun metal --version

      - name: Применить overlay NagramiX
        shell: bash
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export MACOSX_DEPLOYMENT_TARGET=13.0
          python3 ios/apply_overlay.py \
            --source Telegram-iOS \
            --legacy-source Telegram-overlay-input \
            --configuration "$RUNNER_TEMP/nagramix-configuration.json"
          python3 scripts/validate_pip_playback_commands.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
          python3 scripts/validate_round_caption_transport.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
          python3 scripts/validate_repost_copy_integrity.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
          python3 scripts/validate_native_pip_baseline.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
          python3 scripts/validate_copy_delivery.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
          python3 scripts/validate_rich_draft_upload_retry.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
          python3 scripts/validate_pip_transition_geometry.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
          python3 scripts/validate_transfer_consistency.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
          python3 scripts/validate_editor_attachment_delivery.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
          python3 scripts/validate_local_model_size.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
          python3 scripts/validate_archive_deletion_effect.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
