          python3 -c 'import os, shutil; from pathlib import Path; shutil.copytree("Telegram-iOS", Path(os.environ["RUNNER_TEMP"]) / "nagramix-pre-pip", symlinks=True)'
          PYTHONPATH=ios python3 -c 'from pathlib import Path; from pip_swipe_handoff import apply_pip_swipe_handoff; apply_pip_swipe_handoff(Path("Telegram-iOS").resolve(), Path("ios").resolve())'
          python3 scripts/validate_pip_swipe_handoff.py --source Telegram-iOS --baseline "$RUNNER_TEMP/nagramix-pre-pip" --integrated --swiftc "$(xcrun --find swiftc)" --report "$RUNNER_TEMP/pip-swipe-handoff.json"
          python3 scripts/cleanup_source_checkpoint.py --root "$RUNNER_TEMP" --name nagramix-pre-pip --active-source Telegram-iOS
          python3 -c 'import os, shutil; from pathlib import Path; shutil.copytree("Telegram-iOS", Path(os.environ["RUNNER_TEMP"]) / "nagramix-pre-temporary-interaction", symlinks=True)'
          PYTHONPATH=ios python3 -c 'from pathlib import Path; from temporary_message_interaction import apply_temporary_message_interaction; apply_temporary_message_interaction(Path("Telegram-iOS").resolve(), Path("ios").resolve())'
          python3 scripts/validate_temporary_message_interaction.py --source Telegram-iOS --baseline "$RUNNER_TEMP/nagramix-pre-temporary-interaction" --swiftc "$(xcrun --find swiftc)" --report "$RUNNER_TEMP/temporary-message-interaction.json"
          python3 scripts/cleanup_source_checkpoint.py --root "$RUNNER_TEMP" --name nagramix-pre-temporary-interaction --active-source Telegram-iOS
          python3 -c 'import os, shutil; from pathlib import Path; shutil.copytree("Telegram-iOS", Path(os.environ["RUNNER_TEMP"]) / "nagramix-pre-account-settings-entry", symlinks=True)'
          PYTHONPATH=ios python3 -c 'from pathlib import Path; from account_settings_entry import apply_account_settings_entry; apply_account_settings_entry(Path("Telegram-iOS").resolve(), Path("ios").resolve())'
          python3 scripts/validate_account_settings_entry.py --source Telegram-iOS --baseline "$RUNNER_TEMP/nagramix-pre-account-settings-entry" --swiftc "$(xcrun --find swiftc)" --report "$RUNNER_TEMP/account-settings-entry.json"
          python3 scripts/cleanup_source_checkpoint.py --root "$RUNNER_TEMP" --name nagramix-pre-account-settings-entry --active-source Telegram-iOS
          python3 -c 'import os, shutil; from pathlib import Path; shutil.copytree("Telegram-iOS", Path(os.environ["RUNNER_TEMP"]) / "nagramix-pre-release-090-preflight", symlinks=True)'
          PYTHONPATH=ios python3 -c 'from pathlib import Path; from release_090_preflight_fixes import apply_release_090_preflight_fixes; apply_release_090_preflight_fixes(Path("Telegram-iOS").resolve(), Path("ios").resolve())'
          python3 scripts/validate_release_090_preflight_fixes.py --source Telegram-iOS --baseline "$RUNNER_TEMP/nagramix-pre-release-090-preflight" --swiftc "$(xcrun --find swiftc)" --report "$RUNNER_TEMP/release-090-preflight-fixes.json"
          python3 scripts/cleanup_source_checkpoint.py --root "$RUNNER_TEMP" --name nagramix-pre-release-090-preflight --active-source Telegram-iOS
          PYTHONPATH=ios python3 -c 'from pathlib import Path; from release_090_author_compile import apply_release_090_author_compile; apply_release_090_author_compile(Path("Telegram-iOS").resolve(), Path("ios").resolve())'
          python3 scripts/validate_release_090_author_compile.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)" --report "$RUNNER_TEMP/release-090-author-compile.json"
          PYTHONPATH=ios python3 -c 'from pathlib import Path; from round_video_replay_stability import apply_round_video_replay_stability; apply_round_video_replay_stability(Path("Telegram-iOS").resolve(), Path("ios").resolve())'
          python3 scripts/validate_round_video_replay_stability.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)" --report "$RUNNER_TEMP/round-video-replay-stability.json"
          PYTHONPATH=ios python3 -c 'from pathlib import Path; from pip_gallery_placeholder import apply_pip_gallery_placeholder; apply_pip_gallery_placeholder(Path("Telegram-iOS").resolve(), Path("ios").resolve())'
          python3 scripts/validate_pip_gallery_placeholder.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)" --report "$RUNNER_TEMP/pip-gallery-placeholder.json"
          PYTHONPATH=ios python3 -c 'from pathlib import Path; from download_sheet_edge import apply_download_sheet_edge; apply_download_sheet_edge(Path("Telegram-iOS").resolve(), Path("ios").resolve())'
          python3 scripts/validate_download_sheet_edge.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)" --report "$RUNNER_TEMP/download-sheet-edge.json"
          PYTHONPATH=ios python3 -c 'from pathlib import Path; from edit_history_cards import apply_edit_history_cards; apply_edit_history_cards(Path("Telegram-iOS").resolve(), Path("ios").resolve())'
          python3 scripts/validate_edit_history_cards.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)" --report "$RUNNER_TEMP/edit-history-cards.json"
          python3 scripts/validate_late_source_stages.py --source Telegram-iOS --report "$RUNNER_TEMP/late-source-stages.json"
          python3 scripts/validate_custom_member_references.py --source Telegram-iOS
          python3 scripts/validate_upstream_13_2_release.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)"
          python3 scripts/validate_localization_standard.py --source Telegram-iOS --swiftc "$(xcrun --find swiftc)" --final-upstream-13-2
          python3 Telegram-iOS/build-system/Make/PostboxImportCheck.py Telegram-iOS

      - name: Восстановить кеш Bazel
        if: ${{ !inputs.clean_build && !inputs.publish_release }}
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE }}
          key: telegram-ios-${{ runner.os }}-${{ runner.arch }}-${{ env.TELEGRAM_IOS_REF }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            telegram-ios-${{ runner.os }}-${{ runner.arch }}-${{ env.TELEGRAM_IOS_REF }}-

      - name: Подтвердить холодную основу релизной сборки
        if: ${{ inputs.publish_release }}
        env:
          RESTORED_CACHE_KEY: ${{ steps.bazel-cache.outputs.cache-matched-key }}
        shell: bash
        run: |
          test -z "$RESTORED_CACHE_KEY" || {
            echo "Релизная SDK-сборка не должна восстанавливать кеш Bazel."
            exit 1
          }
          python3 - <<'PY'
          import os
          from pathlib import Path
          if any(Path(os.environ["BAZEL_CACHE"]).iterdir()):
              raise SystemExit("Релизная SDK-сборка требует пустой кеш Bazel.")
          PY

      - name: Создать временные профили NagramiX для сборки
        shell: bash
        run: |
          python3 ios/generate_fake_profiles.py \
            --source-profiles Telegram-iOS/build-system/fake-codesigning/profiles \
            --source-certs Telegram-iOS/build-system/fake-codesigning/certs \
            --destination "$RUNNER_TEMP/nagramix-codesigning" \
            --upstream-team C67CF9S4VU \
            --upstream-bundle ph.telegra.Telegraph \
            --team NAGRAMIX0 \
            --bundle com.mr-efes.nagramix

      - name: Собрать нативное ARM64-приложение NagramiX без профилей
        working-directory: Telegram-iOS
        shell: bash
        run: |
          printf '%s\n' 'build --experimental_ui_max_stdouterr_bytes=16777216' >> .bazelrc
          python3 build-system/Make/ImportCertificates.py --path "$RUNNER_TEMP/nagramix-codesigning/certs"
          python3 build-system/Make/Make.py \
            --cacheDir="$BAZEL_CACHE" \
            --overrideXcodeVersion \
            build \
            --continueOnError \
            --configurationPath="$RUNNER_TEMP/nagramix-configuration.json" \
            --codesigningInformationPath="$RUNNER_TEMP/nagramix-codesigning" \
            --buildNumber="${GITHUB_RUN_NUMBER}" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$RUNNER_TEMP/build-artifacts"

      - name: Сохранить кеш Bazel
        if: always() && !inputs.clean_build && !inputs.publish_release && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_CACHE }}
          key: telegram-ios-${{ runner.os }}-${{ runner.arch }}-${{ env.TELEGRAM_IOS_REF }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Сохранить символы для диагностики вылетов
        uses: actions/upload-artifact@v4
        with:
          name: NagramiX-${{ env.NAGRAMIX_VERSION }}-symbols-arm64
          path: ${{ runner.temp }}/build-artifacts/Telegram.DSYMs.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Найти и упаковать неподписанное приложение
        shell: bash
        run: |
          source_ipa="$RUNNER_TEMP/build-artifacts/Telegram.ipa"
          test -f "$source_ipa" || { echo "Built Telegram.ipa was not found at $source_ipa"; exit 1; }
          rm -rf "$RUNNER_TEMP/nagramix-unpack"
          mkdir -p "$RUNNER_TEMP/nagramix-unpack"
          unzip -q "$source_ipa" -d "$RUNNER_TEMP/nagramix-unpack"
          python3 scripts/validate_intro_localization.py \
            "$RUNNER_TEMP/nagramix-unpack/Payload/Telegram.app/ru.lproj/Localizable.strings"
          bash scripts/package_unsigned_ipa.sh \
            "$RUNNER_TEMP/nagramix-unpack/Payload/Telegram.app" \
            "NagramiX-${NAGRAMIX_VERSION}-unsigned.ipa" \
            com.mr-efes.nagramix \
            "$NAGRAMIX_VERSION"

      - name: Записать происхождение сборки
        id: provenance
        shell: bash
        run: |
          upstream_sha="$(git -C Telegram-iOS rev-parse HEAD)"
          printf 'NagramiX version: %s\nNagramiX commit: %s\nTelegram-iOS commit: %s\nWorkflow run: %s/%s/actions/runs/%s\n' \
            "$NAGRAMIX_VERSION" "$GITHUB_SHA" "$upstream_sha" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > BUILD-PROVENANCE.txt
          cat "$RUNNER_TEMP/nagramix-dependencies.txt" >> BUILD-PROVENANCE.txt
          shasum -a 256 "NagramiX-${NAGRAMIX_VERSION}-unsigned.ipa" > SHA256SUMS
          echo "version=$NAGRAMIX_VERSION" >> "$GITHUB_OUTPUT"

      - name: Загрузить неподписанный IPA
        uses: actions/upload-artifact@v4
        with:
          name: NagramiX-${{ env.NAGRAMIX_VERSION }}-unsigned-arm64
          path: |
            NagramiX-${{ env.NAGRAMIX_VERSION }}-unsigned.ipa
            BUILD-PROVENANCE.txt
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: Проверить IPA для публикации Mr_EFES
    needs: build
    if: ${{ always() && !cancelled() && inputs.publish_release && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || inputs.artifact_run_id != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Проверить аккаунт подготовки релиза
        shell: bash
        run: |
          test "$GITHUB_ACTOR" = "Mr-EFES"
          test "$GITHUB_TRIGGERING_ACTOR" = "Mr-EFES"

      - name: Получить аннотацию и валидатор
        uses: actions/checkout@v4
      - name: Проверить источник готового IPA
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$GITHUB_RUN_ID"
          source_sha="$GITHUB_SHA"
          build_number="$GITHUB_RUN_NUMBER"
          if [ -n "$ARTIFACT_RUN_ID" ]; then
            [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
            run_id="$ARTIFACT_RUN_ID"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/source-run.json"
            workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-unsigned-ipa.yml" --jq '.id')"
            jq -e --argjson workflow "$workflow_id" '.head_branch == "main" and .event == "workflow_dispatch" and .status == "completed" and .workflow_id == $workflow' "$RUNNER_TEMP/source-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" --jq 'any(.jobs[]; .name == "build" and .conclusion == "success")' | grep -Fx true
            source_sha="$(jq -r '.head_sha' "$RUNNER_TEMP/source-run.json")"
            build_number="$(jq -r '.run_number' "$RUNNER_TEMP/source-run.json")"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$build_number" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
      - name: Скачать результат проверенной сборки
        uses: actions/download-artifact@v4
        with:
          name: NagramiX-${{ env.NAGRAMIX_VERSION }}-unsigned-arm64
          path: release-assets
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Проверить артефакт для публикации владельцем
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ env.NAGRAMIX_VERSION }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_BUILD_NUMBER: ${{ steps.source.outputs.build_number }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS
          grep -Fx "NagramiX commit: $SOURCE_SHA" BUILD-PROVENANCE.txt
          grep -Fx "NagramiX version: $RELEASE_VERSION" BUILD-PROVENANCE.txt
          grep -Fx "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" BUILD-PROVENANCE.txt
          python3 ../scripts/validate_unsigned_ipa.py \
            --ipa "NagramiX-${RELEASE_VERSION}-unsigned.ipa" \
            --version "$RELEASE_VERSION" --build-number "$SOURCE_BUILD_NUMBER" \
            --source-commit "$SOURCE_SHA" \
            --provenance BUILD-PROVENANCE.txt --checksums SHA256SUMS
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          print("IPA проверен. Финальная публикация выполняется через аккаунт Mr-EFES.")
          print("Скачать исходный Actions ZIP и выполнить из checkout выбранной версии:")
          print("```sh")
          suffix = " --prerelease" if os.environ["RELEASE_PRERELEASE"] == "true" else ""
          print("python3 scripts/publish_owner_release.py --source-run-id " + os.environ["SOURCE_RUN_ID"] + " --artifact-zip /путь/к/скачанному.zip" + suffix)
          print("```")
          PY
