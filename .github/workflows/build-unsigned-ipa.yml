name: Build unsigned NagramiX IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-unsigned-ipa.yml"
      - "nagramix/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      BAZEL_CACHE: ${{ github.workspace }}/.bazel-cache
      NAGRAMIX_VERSION: 0.2.2

    steps:
      - name: Check out NagramiX overlay
        uses: actions/checkout@v4

      - name: Load pinned upstream reference
        id: upstream
        shell: bash
        run: |
          cat nagramix/upstream.env >> "$GITHUB_ENV"
          source nagramix/upstream.env
          echo "ref=$TELEGRAM_IOS_REF" >> "$GITHUB_OUTPUT"

      - name: Validate required Telegram API credentials
        shell: bash
        run: |
          test -n "$TELEGRAM_API_ID" || { echo "Missing TELEGRAM_API_ID repository secret"; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "Missing TELEGRAM_API_HASH repository secret"; exit 1; }

      - name: Check out Telegram-iOS
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: ${{ steps.upstream.outputs.ref }}
          path: Telegram-iOS
          submodules: recursive
          fetch-depth: 1

      - name: Verify expected upstream version
        shell: bash
        run: |
          actual="$(python3 -c 'import json; print(json.load(open("Telegram-iOS/versions.json"))["app"])')"
          test "$actual" = "$TELEGRAM_IOS_VERSION" || {
            echo "Pinned ref reports Telegram $actual, expected $TELEGRAM_IOS_VERSION"
            exit 1
          }

      - name: Select required Xcode
        shell: bash
        run: |
          xcode_version="$(python3 -c 'import json; print(json.load(open("Telegram-iOS/versions.json"))["xcode"])')"
          sudo xcode-select -s "/Applications/Xcode_${xcode_version}.app/Contents/Developer"

      - name: Apply NagramiX overlay
        shell: bash
        run: |
          python3 nagramix/apply_overlay.py \
            --source Telegram-iOS \
            --configuration "$RUNNER_TEMP/nagramix-configuration.json"

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE }}
          key: telegram-ios-${{ runner.os }}-${{ runner.arch }}-${{ env.TELEGRAM_IOS_REF }}

      - name: Generate build-only NagramiX profiles
        shell: bash
        run: |
          python3 nagramix/generate_fake_profiles.py \
            --source-profiles Telegram-iOS/build-system/fake-codesigning/profiles \
            --source-certs Telegram-iOS/build-system/fake-codesigning/certs \
            --destination "$RUNNER_TEMP/nagramix-codesigning" \
            --upstream-team C67CF9S4VU \
            --upstream-bundle ph.telegra.Telegraph \
            --team NAGRAMIX0 \
            --bundle com.gamesfanteam.nagramix

      - name: Build native NagramiX arm64 application without profiles
        working-directory: Telegram-iOS
        shell: bash
        run: |
          python3 build-system/Make/ImportCertificates.py --path "$RUNNER_TEMP/nagramix-codesigning/certs"
          python3 build-system/Make/Make.py \
            --cacheDir="$BAZEL_CACHE" \
            --overrideXcodeVersion \
            build \
            --configurationPath="$RUNNER_TEMP/nagramix-configuration.json" \
            --codesigningInformationPath="$RUNNER_TEMP/nagramix-codesigning" \
            --buildNumber="${GITHUB_RUN_NUMBER}" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$RUNNER_TEMP/build-artifacts"

      - name: Save Bazel cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_CACHE }}
          key: telegram-ios-${{ runner.os }}-${{ runner.arch }}-${{ env.TELEGRAM_IOS_REF }}

      - name: Locate and package unsigned application
        shell: bash
        run: |
          source_ipa="$RUNNER_TEMP/build-artifacts/Telegram.ipa"
          test -f "$source_ipa" || { echo "Built Telegram.ipa was not found at $source_ipa"; exit 1; }
          rm -rf "$RUNNER_TEMP/nagramix-unpack"
          mkdir -p "$RUNNER_TEMP/nagramix-unpack"
          unzip -q "$source_ipa" -d "$RUNNER_TEMP/nagramix-unpack"
          bash scripts/package_unsigned_ipa.sh \
            "$RUNNER_TEMP/nagramix-unpack/Payload/Telegram.app" \
            "NagramiX-${NAGRAMIX_VERSION}-unsigned.ipa" \
            com.gamesfanteam.nagramix \
            "$NAGRAMIX_VERSION"

      - name: Record provenance
        shell: bash
        run: |
          upstream_sha="$(git -C Telegram-iOS rev-parse HEAD)"
          printf 'Telegram-iOS commit: %s\nNagramX reference: %s\n' "$upstream_sha" "$NAGRAMX_REFERENCE_REF" > BUILD-PROVENANCE.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NagramiX-${{ env.NAGRAMIX_VERSION }}-unsigned-arm64
          path: |
            NagramiX-${{ env.NAGRAMIX_VERSION }}-unsigned.ipa
            BUILD-PROVENANCE.txt
          if-no-files-found: error
          retention-days: 14
